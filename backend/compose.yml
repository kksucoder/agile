services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: task_board
      POSTGRES_USER: task_board
      POSTGRES_PASSWORD: task_board
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - task_board_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_board -d task_board"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  task_board_pgdata:
